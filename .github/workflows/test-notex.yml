name: Test Notex cask

on:
  pull_request:
    paths:
      - Casks/notex.rb
      - scripts/update_notex.py
      - tests/**
      - .github/workflows/*notex.yml
  push:
    branches: [main]
    paths:
      - Casks/notex.rb
      - scripts/update_notex.py
      - tests/**
      - .github/workflows/*notex.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - run: ruby -c Casks/notex.rb
